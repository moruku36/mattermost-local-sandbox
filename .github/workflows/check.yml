name: Check
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q reply_drafter.py seed_data.py
      - run: python -m unittest discover -s tests -v
      - run: bash -n setup.sh
      - run: POSTGRES_PASSWORD=ci-only docker compose config --quiet
